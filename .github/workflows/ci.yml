# Test gate for the desktop studio.
#
# Tests live in their own workflow: they run on pull requests, while the release
# workflow runs on pushes to the default branch. Mixing the two means a broken
# release blocks a pull request, or the reverse.
#
# The suite needs no hardware and no CAN interface — the plant it drives is
# simulated — but it does need Qt, because the pages are built and driven with
# Qt widgets under the offscreen platform plugin. `conftest.py` selects that
# plugin, so no display is required.
#
# The LiteGrip SDK is vendored under src/litegrip (see the README), so a runner
# has it without checking out anything else. Every test runs here — nothing is
# skipped for want of an SDK — which is also what keeps the vendored copy honest:
# a drift between it and the surface the console calls fails in this job.
#
# The suite runs twice, on 3.10 and on 3.14. One interpreter is one set of blind
# spots, and the vendored SDK proved it: fcntl.ioctl() grew a guard byte in 3.14
# and rejected the short buffer the SDK's _iface_mtu() handed it, so the console
# could not connect to a real gripper there (nexform-tech/litegrip-python#63).
# The suite was green on 3.10 throughout, because the simulated backend never
# calls that helper. This job cannot catch that defect either — it has no CAN
# interface — but it does hold the console itself to running on 3.14, which is
# the claim the second interpreter is here for.
#
# The second interpreter is a step in the same job, not a matrix. A matrix names
# its checks `test (3.10)` / `test (3.14)`, so enabling "require the `test` check"
# on main here later would block every merge on a check that never reports. That
# is not hypothetical: litegrip-python's main requires the check named `test`,
# and its first attempt at a second interpreter used a matrix and left every
# merge blocked until the shape was changed back.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "README.md" "README.zh-CN.md" "src/litegrip/VENDORED.md"

      - name: Validate repository standards
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          python3 -c "import json; json.load(open('.releaserc.json'))"
          python3 -c "import json; json.load(open('.markdownlint.json'))"
          echo "repository standards OK"

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the Qt libraries the offscreen platform needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Install the studio and its test dependencies
        run: |
          python -m pip install --upgrade pip
          # `project.version` holds the semantic-release placeholder, which is
          # not a PEP 440 version, so setuptools refuses to build the metadata
          # while it is there. A publish job substitutes the released value in
          # its own workspace (the release rules); this job substitutes a valid one in
          # the checkout, and the file in the repository keeps its placeholder.
          # The match is asserted: a placeholder written differently fails here
          # rather than quietly installing a version nobody chose.
          grep -q '^version = "0\.0\.0-semantic-release"$' pyproject.toml
          sed -i 's/^version = "0\.0\.0-semantic-release"$/version = "0.0.0"/' pyproject.toml
          python -m pip install -e ".[dev]"

      - name: Run the test suite on 3.10
        run: |
          python -VV
          python -m pytest -q

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the studio on 3.14
        run: |
          # No `sed` here: pyproject.toml still carries the valid `0.0.0` the
          # step above substituted, and the placeholder was left in the
          # repository rather than in this workspace.
          python -m pip install -e ".[dev]"

      - name: Run the test suite on 3.14
        run: |
          python -VV
          python -m pytest -q
